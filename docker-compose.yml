version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scuser
      POSTGRES_PASSWORD: scpassword
      POSTGRES_DB: sctrading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scuser -d sctrading"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
