services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/prod.db"
      REPORTS_DATA_FILE: "/data/reports.json"
      UPLOADS_DIR: "/data/uploads"
      UEX_API_BASE: ${UEX_API_BASE:-https://api.uexcorp.uk/2.0}
      UEX_API_TOKEN: ${UEX_API_TOKEN}
      PRICE_RETENTION_DAYS: ${PRICE_RETENTION_DAYS:-30}
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-30}
      CRON_SECRET: ${CRON_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - appdata:/data
    restart: unless-stopped

volumes:
  appdata:
